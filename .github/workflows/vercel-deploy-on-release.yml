name: Vercel Deploy On Release
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  workflow_run:
    # Matched by DISPLAY NAME against release-database-compatibility-check.yml.
    # If that workflow's `name:` changes without updating this list, prod
    # deploys silently stop firing.
    workflows:
      - Release Database Compatibility Check And Push
    types:
      - completed

# Vercel is authenticated with repository secrets, not GITHUB_TOKEN, so
# scoping the token down does not affect the deployment.
permissions:
  contents: read

jobs:
  Deploy-Production:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install Vercel CLI
        run: bun i --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
